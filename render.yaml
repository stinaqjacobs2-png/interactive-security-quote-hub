services:
  - type: web
    name: interactive-security-quote-hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3100
      - key: BCRYPT_ROUNDS
        value: 12
      - key: MAX_FAILED_LOGINS
        value: 5
      - key: LOCKOUT_MINUTES
        value: 30
      - key: SESSION_IDLE_MINUTES
        value: 30
      - key: SESSION_ABSOLUTE_HOURS
        value: 8
      - key: PASSWORD_RESET_MINUTES
        value: 30
    disk:
      name: app-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
